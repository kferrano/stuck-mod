name: "🐞 Bug report"
description: "Tell us what's not working in Stuck Mod"
title: "[Bug]: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the fields below so we can reproduce it.

  - type: input
    id: mod-version
    attributes:
      label: Mod version
      description: The Stuck Mod version you are using.
      placeholder: "e.g., 1.0.0 (MC 1.20.1) or 1.0.0 (MC 1.18.2)"
    validations:
      required: true

  - type: input
    id: mc-version
    attributes:
      label: Minecraft version
      placeholder: "e.g., 1.20.1 or 1.18.2"
    validations:
      required: true

  - type: input
    id: forge-version
    attributes:
      label: Forge version
      placeholder: "e.g., 47.2.20 (for 1.20.1) or 40.2.21 (for 1.18.2)"
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      description: Where does the issue occur?
      options:
        - Singleplayer
        - Dedicated server
        - Multiplayer client (connected to server)
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the problem.
      placeholder: "When I use /stuck in a 2x3 hole, it says I'm not stuck..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List all steps needed to trigger the bug.
      placeholder: |
        1. Go into a 2x3 hole (wall height 2)
        2. Run /stuck
        3. Observe result
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: "I expected /stuck to teleport me to the first safe free space above."
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste the relevant part of `latest.log` or a crash report. Use a paste service for long logs.
      render: shell

  - type: textarea
    id: modlist
    attributes:
      label: Mod list / pack
      description: If applicable, list other installed mods and versions (or link to your modpack).

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, server settings, config snippets, anything else helpful.
